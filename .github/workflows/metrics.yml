name: Metrics

# 每天北京时间早 8 点 + 每次推送 + 支持手动触发
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: 生成统计卡片（浅色·经典）
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          repositories_forks: no
          # 提交日历
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          # 常用语言
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
      - name: 生成统计卡片（深色·终端风）
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics-dark.svg
          template: terminal
          base: header, metadata
          config_timezone: Asia/Shanghai
          repositories_forks: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 生成贪吃蛇动画
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bailong-Hakuryu
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#536F9D&color_dots=#EBEDF0,#DDE9EB,#BCD6DB,#83B6BE,#2F7F90
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#72B8C4&color_dots=#161B22,#23313B,#304A57,#3E6471,#536F9D

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
